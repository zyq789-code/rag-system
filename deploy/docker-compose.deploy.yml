# 大陆 ECS 部署专用覆盖：
#   - 挂载宿主 HF 模型缓存 + 强制离线加载
#   - restart: always 服务器重启后服务自动恢复
#
# 用法：docker compose -f docker-compose.yml -f deploy/docker-compose.deploy.yml up -d --build
# 前置：先运行 deploy/prepare_models.sh 把模型下载到 ${HF_CACHE_DIR:-$HOME/.cache/huggingface}
#
# ⚠️ 安全提醒：本项目无登录。若部署到公网，建议开启 Basic Auth 访问口令，
#    方法：给 frontend 追加以下挂载并重建容器（详见 deploy/README.md 附录）：
#      volumes:
#        - ./deploy/nginx.auth.conf:/etc/nginx/conf.d/default.conf:ro
#        - /etc/nginx/rag.htpasswd:/etc/nginx/rag.htpasswd:ro

services:
  postgres:
    restart: always

  redis:
    restart: always

  chromadb:
    restart: always

  backend:
    restart: always
    volumes:
      - ${HF_CACHE_DIR:-$HOME/.cache/huggingface}:/root/.cache/huggingface
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

  celery:
    restart: always
    volumes:
      - ${HF_CACHE_DIR:-$HOME/.cache/huggingface}:/root/.cache/huggingface
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

  frontend:
    restart: always
