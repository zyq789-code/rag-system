# 部署用 nginx 配置：带 Basic Auth 访问口令，防止陌生人白嫖 API Key
# 挂载方式见 docker-compose.deploy.yml 的 frontend volumes
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        auth_basic "RAG Knowledge Base - 请输入访问口令";
        auth_basic_user_file /etc/nginx/rag.htpasswd;
    }

    # /api 也要鉴权（避免前端 JS 绕开口令直接调接口）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        auth_basic "RAG Knowledge Base - 请输入访问口令";
        auth_basic_user_file /etc/nginx/rag.htpasswd;
    }
}
